<!DOCTYPE html>
<html lang="vi">
    <head>
        <title>HINH CHU NHAT</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }

            body {
                background: linear-gradient(135deg, #e0eafc, #cfdef3);
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }

            .form-card {
                background: #ffffff;
                padding: 30px;
                border-radius: 12px;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
                width: 100%;
                max-width: 380px;
            }

            .form-card h2 {
                text-align: center;
                color: #2c3e50;
                margin-bottom: 20px;
                font-size: 1.3rem;
            }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            td {
                padding: 10px 4px;
                color: #34495e;
                font-weight: 600;
                font-size: 0.95rem;
            }

            input[type="number"] {
                width: 100%;
                padding: 10px 12px;
                border: 1.5px solid #cbd5e1;
                border-radius: 6px;
                font-size: 0.95rem;
                outline: none;
                transition: border-color 0.2s, box-shadow 0.2s;
            }

            input[type="number"]:focus {
                border-color: #3498db;
                box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
            }

            input[type="submit"] {
                width: 100%;
                background: linear-gradient(135deg, #3498db, #2980b9);
                color: white;
                border: none;
                padding: 12px;
                border-radius: 6px;
                font-size: 1rem;
                font-weight: bold;
                cursor: pointer;
                margin-top: 10px;
                transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            }

            input[type="submit"]:hover {
                box-shadow: 0 4px 12px rgba(52, 152, 219, 0.4);
                transform: translateY(-1px);
            }

            input[type="submit"]:active {
                transform: translateY(0);
            }
        </style>
    </head>
    <body>

        <div class="form-card">
            <h2>TÍNH CHU VI, DIỆN TÍCH HCN</h2>

            <form action="TinhHCN" method="post">
                <table>
                    <tbody>
                        <tr>
                            <td><label for="chieuDai">Nhập chiều dài :</label></td>
                            <td><input type="number"  name="chieuDai" placeholder="Nhập chiều dài HCN" required /></td>
                        </tr>
                        <tr>
                            <td><label for="chieuRong">Nhập chiều rộng :</label></td>
                            <td><input type="number"  name="chieuRong" placeholder="Nhập chiều rộng HCN" required /></td>
                        </tr>
                        <tr>
                            <td colspan="2">
                                <input type="submit" value="Gửi Server Tính" />
                            </td>
                        </tr>
                    </tbody>
                </table>
            </form>
        </div>

    </body>
</html>
