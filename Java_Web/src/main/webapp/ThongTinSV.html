<html>
    <head>
        <title>THÔNG TIN SINH VIÊN</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
        <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
        background-color: #f1f5f9;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }

    /* Định dạng Khung Form */
    form {
        background: #ffffff;
        padding: 32px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        border-top: 5px solid #0284c7; /* Viền màu Xanh Biển */
        width: 100%;
        max-width: 480px;
    }

    /* Tiêu đề nếu nằm ngoài hoặc trong Form */
    h2, h3, div:first-child {
        color: #0f172a;
        font-size: 1.35rem;
        font-weight: 700;
        text-align: center;
        margin-bottom: 20px;
        letter-spacing: 0.5px;
    }

    /* Định dạng Bảng */
    table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0 14px;
    }

    td {
        font-size: 0.95rem;
        font-weight: 600;
        color: #334155;
        vertical-align: middle;
    }

    /* Cột nhãn tên trường bên trái */
    td:first-child {
        white-space: nowrap;
        padding-right: 12px;
        width: 35%;
    }

    /* Các ô nhập dữ liệu */
    input[type="text"],
    input[type="email"],
    input[type="number"] {
        width: 100%;
        padding: 10px 14px;
        border: 1.5px solid #cbd5e1;
        border-radius: 6px;
        font-size: 0.95rem;
        color: #0f172a;
        outline: none;
        transition: all 0.2s ease-in-out;
    }

    /* Hiệu ứng khi bấm vào ô nhập */
    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="number"]:focus {
        border-color: #0284c7;
        box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    /* Nút Submit */
    input[type="submit"],
    button[type="submit"] {
        width: 100%;
        padding: 12px;
        background-color: #0284c7;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        margin-top: 10px;
        transition: background-color 0.2s ease, transform 0.1s ease;
    }

    input[type="submit"]:hover,
    button[type="submit"]:hover {
        background-color: #0369a1;
    }

    input[type="submit"]:active,
    button[type="submit"]:active {
        transform: scale(0.99);
    }
</style>

    </head>
    <body>
            <div class="form-card">
              <h2>SINH VIÊN</h2>
           
              <form action="SinhVien" method="post">
                  <table>
                      <tbody>
                          <tr>
                              <td><label for="maSV">Nhập Mã SINH VIÊN:</label></td>
                              <td><input type="text"  name="maSV" placeholder="Nhập Mã SINH VIÊN" required /></td>
                          </tr>
                          <tr>
                             <td><label for="hoTen">Nhập Họ Tên SINH VIÊN:</label></td>
                              <td><input type="text"  name="hoTen" placeholder="Nhập Họ Tên SINH VIÊN" required /></td>
                          </tr>
                          <tr>
                              <td><label for="lop">Nhập Lớp:</label></td>
                              <td><input type="text"  name="Lop" placeholder="Nhập Lớp" required /></td>
                          </tr>
                           <tr>
                              <td><label for="email">Nhập Email:</label></td>
                              <td><input type="text"  name="Email" placeholder="Nhập Email" required /></td>
                          </tr>
                           <tr>
                              <td><label for="email">Nhập Ngày Sinh::</label></td>
                              <td><input type="date"  name="NgaySinh" placeholder="Nhập Ngày Sinh" required /></td>
                          </tr>
                          <tr>
                            <td colspan="2">
                                <input type="submit" value="Nhập" />
                            </td>
                        </tr>
                      </tbody>
                  </table>
              </form>
          </div>
    </body>
</html>
